<!doctype html><meta charset="utf-8"><title>Body map GPU checks</title><style>body{font:15px/1.5 system-ui}canvas{width:700px;height:1000px}#local{width:300px;height:370px}pre{white-space:pre-wrap}</style><h1>實際 WebGL 渲染與點選檢查</h1><pre id="result">Loading…</pre><canvas id="map"></canvas><canvas id="local" width="600" height="740"></canvas><script type="module">
import {BodyRenderer} from '../body-renderer.js';
const log=document.querySelector('#result'),lines=[],check=(ok,text)=>{if(!ok)throw Error(text);lines.push('PASS '+text);log.textContent=lines.join('\n');};
try{
 const manifest=await(await fetch('../assets/body-model/manifest.json')).json(),chunks=await Promise.all(manifest.files.map(async f=>new Uint8Array(await(await fetch('../assets/body-model/'+f.file)).arrayBuffer()))),binary=await new Response(new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
 const renderer=new BodyRenderer(document.querySelector('#map'),manifest,binary),gl=renderer.gl,find=name=>manifest.records.find(r=>r.name===name),rf=find('right rectus femoris'),vi=find('right vastus intermedius'),leftRF=find('left rectus femoris');
 function frame(view){renderer.draw(view,true);gl.bindFramebuffer(gl.FRAMEBUFFER,renderer.framebuffer);const pixels=new Uint8Array(renderer.width*renderer.height*4);gl.readPixels(0,0,renderer.width,renderer.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);gl.bindFramebuffer(gl.FRAMEBUFFER,null);const counts=new Map(),samples=new Map();for(let i=0;i<pixels.length;i+=4){const id=pixels[i]+pixels[i+1]*256;if(id){counts.set(id,(counts.get(id)||0)+1);samples.set(id,{x:i/4%renderer.width,y:renderer.height-1-Math.floor(i/4/renderer.width)});}}return {counts,samples};}
 const front=frame('front');check(front.counts.get(rf.id)>50,'front right rectus femoris has a visible surface');check(front.counts.get(leftRF.id)>50,'front left rectus femoris has a visible surface');check(front.samples.get(rf.id).x<front.samples.get(leftRF.id).x,'anterior anatomical right is viewer left');
 let p=front.samples.get(rf.id);check(renderer.pick(p.x,p.y)===rf.id,'front surface pixel picks its exact source object');
 const back=frame('back'),glute=find('right gluteus maximus');check(back.counts.get(glute.id)>50,'posterior gluteus maximus visible');p=back.samples.get(glute.id);check(renderer.pick(p.x,p.y)===glute.id,'back surface pixel picks its exact source object');
 renderer.hidden=new Set([rf.id,leftRF.id]);const deep=frame('front');check(!deep.counts.has(rf.id)&&!deep.counts.has(leftRF.id),'hidden rectus femoris cannot be picked');check((deep.counts.get(vi.id)||0)>(front.counts.get(vi.id)||0)*2,'removing rectus femoris exposes vastus intermedius through depth testing');
 renderer.draw('front');renderer.zoom(3,'front');renderer.pan(90,60,'front');const zoomed=frame('front');p=zoomed.samples.get(vi.id);check(Boolean(p)&&renderer.pick(p.x,p.y)===vi.id,'zoom and pan preserve pixel picking');
 renderer.hidden.clear();renderer.focusIds=new Set([rf.id]);renderer.showBones=false;const local=document.querySelector('#local'),camera=renderer.localCamera([rf],local.width,local.height);renderer.drawLocal(local,'front',camera);const a=local.getContext('2d').getImageData(0,0,local.width,local.height).data;
 renderer.zoom(2,'front');renderer.draw('front');renderer.drawLocal(local,'front',camera);const b=local.getContext('2d').getImageData(0,0,local.width,local.height).data;check(a.every((v,i)=>v===b[i]),'local render is independent of whole-body pixel resolution and zoom');
 renderer.scene([{p:camera,side:'front'}],local.width,local.height,true,true);const pixels=new Uint8Array(local.width*local.height*4);gl.readPixels(0,0,local.width,local.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let sample=null,count=0;for(let i=0;i<pixels.length;i+=4){const id=pixels[i]+pixels[i+1]*256;if(id){if(id!==rf.id)throw Error('Isolate returned another object');count++;sample={x:i/4%local.width,y:local.height-1-Math.floor(i/4/local.width)};}}
 check(count>1000,'isolated local render contains actual selected muscle geometry');check(renderer.pickLocal(sample.x,sample.y,'front',camera,local.width,local.height)===rf.id,'local high-resolution pixel picks exact source geometry');check(gl.getError()===gl.NO_ERROR,'no WebGL errors');
 const qp=find('right flexor accessorius'),lo=qp.bounds[0],hi=qp.bounds[1],plantar={cx:(lo[0]+hi[0])/2,cz:-(lo[1]+hi[1])/2,width:local.width,yaw:0,pitch:-Math.PI/2,s:Math.min(local.width*.7/(hi[0]-lo[0]),local.height*.7/(hi[1]-lo[1]))};renderer.focusIds=new Set([qp.id]);renderer.scene([{p:plantar,side:'front'}],local.width,local.height,true,true);gl.readPixels(0,0,local.width,local.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);count=0;sample=null;for(let i=0;i<pixels.length;i+=4)if(pixels[i]+pixels[i+1]*256===qp.id){count++;sample={x:i/4%local.width,y:local.height-1-Math.floor(i/4/local.width)};}
 check(count>1000,'plantar pitch view contains the original quadratus plantae surface');check(renderer.pickLocal(sample.x,sample.y,'front',plantar,local.width,local.height)===qp.id,'plantar rotated local view preserves exact source-object picking');
 const fdl=find('right flexor digitorum longus');renderer.focusIds.add(fdl.id);renderer.contextMuscleIds=new Set([fdl.id]);renderer.reviewXray=true;renderer.showBones=true;renderer.contextIds=new Set();renderer.scene([{p:plantar,side:'front'}],local.width,local.height,false,true);check(renderer.visible(fdl)&&gl.getError()===gl.NO_ERROR,'embedded tendon source can render as transparent context without WebGL errors');
 renderer.resetCamera();renderer.showBones=true;renderer.focusIds=null;renderer.contextIds=null;renderer.contextMuscleIds=null;renderer.reviewXray=false;renderer.draw('both');lines.push('ALL GPU CHECKS PASSED');log.textContent=lines.join('\n');document.title='PASS · Body map GPU checks';
}catch(error){log.textContent+='\nFAIL '+error.stack;document.title='FAIL · Body map GPU checks';console.error(error);}
</script>
