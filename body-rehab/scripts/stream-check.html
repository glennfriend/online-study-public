<!doctype html><meta charset="utf-8"><title>Online geometry checks</title><style>body{font:14px system-ui}canvas{width:700px;height:1000px}pre{white-space:pre-wrap}</style><h1>按需載入與完整模型對照</h1><pre id="result">Loading…</pre><canvas id="full"></canvas><canvas id="stream"></canvas><script type="module">
import {BodyRenderer} from '../body-renderer.js';
import {OnlineGeometry} from '../online-geometry.js';
import {identify} from '../muscle-catalogue.mjs';
const result=document.querySelector('#result'),lines=[],check=(ok,text)=>{if(!ok)throw Error(text);lines.push('PASS '+text);result.textContent=lines.join('\n');};
try{
 const m=await(await fetch('../assets/body-model/manifest.json',{cache:'no-store'})).json(),packed=await Promise.all(m.files.map(async f=>new Uint8Array(await(await fetch('../assets/body-model/'+f.file,{cache:'no-store'})).arrayBuffer()))),raw=await new Response(new Blob(packed).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(),full=new BodyRenderer(document.querySelector('#full'),m,raw),stream=new BodyRenderer(document.querySelector('#stream'),m),loader=new OnlineGeometry(m,stream,{base:new URL('../assets/body-model/',location.href)}),rf=m.records.find(r=>r.name==='right rectus femoris'),surface=new Set(['trapezius','latissimus dorsi','deltoid','pectoralis major','rectus abdominis','external abdominal oblique','gluteus maximus','gastrocnemius','biceps brachii','rectus femoris','sartorius','platysma','sternocleidomastoid']);full.resize();stream.resize();
 const seeds=new Set(m.records.filter(r=>r.kind==='muscle'&&surface.has(identify(r.name).base)).map(r=>r.id));
 function scene(view){return {width:stream.width,height:stream.height,frames:(view==='both'?['front','back']:[view]).map((side,i)=>{const p=stream.projection(view,side);return {p,side,offset:i*p.width};})};}
 function pixels(renderer,s){renderer.scene(s.frames,s.width,s.height,true,true);const gl=renderer.gl,out=new Uint8Array(s.width*s.height*4);gl.readPixels(0,0,s.width,s.height,gl.RGBA,gl.UNSIGNED_BYTE,out);return out;}
 async function compare(label,view,seed=new Set()){const s=scene(view);await loader.visible([s],seed);const a=pixels(full,s),b=pixels(stream,s);check(a.every((v,i)=>v===b[i]),label+' has exactly the same visible source IDs as the complete model');const ids=new Set();for(let i=0;i<a.length;i+=4){const id=a[i]+a[i+1]*256;if(id)ids.add(id);}lines.push(label+' visible objects '+ids.size);result.textContent=lines.join('\n');}
 await compare('native whole-body front/back','both',seeds);check(loader.requestCount<650,'visibility loading omits fully occluded source objects');lines.push('NATIVE '+JSON.stringify(loader.stats()));result.textContent=lines.join('\n');
 const hidden=m.records.filter(r=>r.kind==='muscle'&&surface.has(identify(r.name).base)).map(r=>r.id);full.hidden=new Set(hidden);stream.hidden=new Set(hidden);await compare('deep layer','front');
 full.hidden.clear();stream.hidden.clear();full.showBones=stream.showBones=false;stream.focusIds=full.focusIds=new Set([rf.id]);await compare('isolated muscle without bones','back',new Set([rf.id]));check(stream.meshBuffers.size<=1,'leaving the whole body releases unused GPU meshes');
 full.focusIds=stream.focusIds=null;full.showBones=stream.showBones=true;stream.zoom(5,'front');stream.pan(40,200,'front');await compare('zoom and pan reveal newly required geometry','front');
 // Exact-scene changes are separately exercised by the attachment viewer.
 await loader.exact([rf]);check(stream.meshBuffers.size===1,'exact-scene requests retain only requested mesh');check(stream.gl.getError()===stream.gl.NO_ERROR,'streaming and occlusion queries have no WebGL errors');
 await stream.loadOverview(m.overview,new URL('../assets/body-model/',location.href));stream.resetCamera();stream.overviewActive=true;stream.draw('both',true);const gl=stream.gl,overview=new Uint8Array(stream.width*stream.height*4);gl.bindFramebuffer(gl.FRAMEBUFFER,stream.framebuffer);gl.readPixels(0,0,stream.width,stream.height,gl.RGBA,gl.UNSIGNED_BYTE,overview);full.hidden.clear();full.focusIds=null;full.showBones=true;const source=pixels(full,scene('both'));let interior=0,wrong=0;for(let y=2;y<stream.height-2;y++)for(let x=2;x<stream.width-2;x++){const p=(y*stream.width+x)*4,id=source[p]+source[p+1]*256;if(!id)continue;let stable=true;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const q=((y+dy)*stream.width+x+dx)*4;if(source[q]+source[q+1]*256!==id)stable=false;}if(stable){interior++;if(overview[p]+overview[p+1]*256!==id)wrong++;}}
 check(interior>10000&&wrong/interior<.001,'fast whole-body ID map agrees with source geometry away from raster edges');check(stream.overviewBytes<1600000,'complete front/back overview is under 1.6 MB without mesh prefetch');check(gl.getError()===gl.NO_ERROR,'overview colour, selection and picking shaders have no WebGL errors');
 stream.selected=new Set([rf.id]);stream.emphasis=new Map([[m.records.find(r=>r.name==='right gluteus maximus').id,[.12,.48,.39]]]);stream.draw('both');const colour=new Uint8Array(stream.width*stream.height*4);gl.readPixels(0,0,stream.width,stream.height,gl.RGBA,gl.UNSIGNED_BYTE,colour);const pick=id=>{for(let i=0;i<overview.length;i+=4)if(overview[i]+overview[i+1]*256===id)return i;throw Error('No source ID '+id);},orange=pick(rf.id),green=pick(m.records.find(r=>r.name==='right gluteus maximus').id);check(colour[orange]>colour[orange+1]&&colour[green+1]>colour[green],'overview preserves muscle selection and movement highlight colours');
 await loader.exact([]);let fail=true;const retry=new OnlineGeometry(m,stream,{base:new URL('../assets/body-model/',location.href),fetcher:(url,options)=>{if(options.cache!=='no-store')throw Error('Wrong cache policy');return fail?Promise.reject(new TypeError('Simulated connection failure')):fetch(url,options);}});let failed=false;try{await retry.exact([rf]);}catch{failed=true;}check(failed,'a failed online request is reported instead of pretending geometry loaded');fail=false;await retry.exact([rf]);check(stream.meshBuffers.size===1,'failed downloads can be retried without a full-page reload');
 lines.push('ALL STREAM CHECKS PASSED');result.textContent=lines.join('\n');document.title='PASS · Online geometry checks';full.dispose();loader.dispose();
}catch(error){result.textContent+='\nFAIL '+error.stack;document.title='FAIL · Online geometry checks';console.error(error);}
</script>
