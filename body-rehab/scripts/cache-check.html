<!doctype html><meta charset="utf-8"><title>Project storage check</title><h1>本專案儲存檢查</h1><button id="inspect">檢查儲存狀態</button><pre id="result">尚未檢查</pre><script>
document.querySelector('#inspect').onclick=async()=>{const names=await caches.keys(),project=[];for(const name of names)if(/^body-rehab-(?:map-v\d+|anatomy-v1)$/.test(name)){const c=await caches.open(name);project.push({name,urls:(await c.keys()).map(r=>r.url)});}const registrations=(await navigator.serviceWorker.getRegistrations()).map(r=>({scope:r.scope,script:r.active?.scriptURL}));document.querySelector('#result').textContent=JSON.stringify({project,registrations},null,2);};
</script>
