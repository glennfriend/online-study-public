<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#23695c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <title>人體部位圖</title>
  <style>
    :root {
      --ink: #253e3b; --muted: #64756f; --green: #23695c; --paper: #fffdf8; --line: #e2e7dc;
      --skin: #f6e9de; --skin-line: #c9b3a1;
      --muscle: #e8c3b2; --muscle-line: #b98571; --deep: #dcae9b; --bone: #f2ead6; --bone-line: #a89a78; --tendon: #efe4c8;
      --pale: #f1e4db; --pale-line: #d8c2b5;
      --sel: #e07b22;
      --p: #c2410c; --s: #f4a259; --w: #7a5bc0; --x: #3b82b6;
      --t: #23695c; --u: #8cc4a8; --i: #c0392b;
    }
    * { box-sizing: border-box; }
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; background: #f5f3eb; color: var(--ink); font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; line-height: 1.7; }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid #d48b38; outline-offset: 2px; }
    main { width: min(1160px, calc(100% - 32px)); margin: 20px auto 56px; }
    .back { display: inline-block; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: .95rem; }
    .back:hover { color: var(--green); }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: .03em; line-height: 1.3; }
    .lead { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
    .disclaimer { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid #d9b36c; background: #fbf4e3; color: #6b5a33; font-size: 13.5px; border-radius: 0 8px 8px 0; }

    .tabs { display: flex; gap: 6px; margin: 18px 0 14px; border-bottom: 2px solid var(--line); }
    .tabs button { border: 0; background: none; color: var(--muted); padding: 8px 14px 10px; font-size: 16px; font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tabs button[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }

    .layout { display: grid; gap: 18px; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: minmax(360px, 460px) 1fr; align-items: start; }
      .figure-wrap { position: sticky; top: 12px; }
    }
    .figure-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 8px; }
    .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .figs figure { margin: 0; text-align: center; }
    .figs figcaption { font-size: 13px; color: var(--muted); margin-top: -4px; }
    svg.body { width: 100%; height: auto; display: block; }
    svg.body .r { cursor: pointer; stroke-width: .6; transition: fill .15s; }
    svg.body .r:hover { filter: brightness(.93); }
    svg.body .deco { fill: none; stroke: #00000026; stroke-width: .5; pointer-events: none; }
    svg.body .ghost { opacity: .45; }
    .layers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
    .layers button, .pill { border: 1px solid #ced8cc; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
    .layers[hidden] { display: none; }
    .layers button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    .legend i.dash { background: repeating-linear-gradient(45deg, var(--w) 0 2px, #fff 2px 4px) !important; }
    .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

    .panel { min-width: 0; }
    .group { margin: 0 0 12px; }
    .group h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 3px 11px; font-size: 14px; line-height: 1.6; }
    .chip:hover { border-color: #a9c2ad; }
    .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
    .chip small { color: var(--muted); margin-left: 3px; font-size: 11.5px; }
    .chip[aria-pressed="true"] small { color: #ffffffc0; }
    .chip.c-p { border-color: var(--p); background: #fbe3d6; } .chip.c-s { border-color: var(--s); background: #fdf0e2; }
    .chip.c-w { border-color: var(--w); background: #efeafa; } .chip.c-x { border-color: var(--x); background: #e4f0f8; }
    .chip.c-t { border-color: var(--t); background: #dcefe6; } .chip.c-u { border-color: var(--u); background: #eef7f2; }
    .chip.c-i { border-color: var(--i); background: #f9e1dd; }

    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 14px; }
    .card h2 { margin: 0; font-size: 22px; line-height: 1.4; }
    .card h2 .en { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 8px; }
    .badge { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; background: #e3efe9; color: var(--green); font-weight: 600; margin-left: 6px; vertical-align: 3px; }
    .card dl { margin: 10px 0 0; }
    .card dt { font-weight: 700; font-size: 14px; color: var(--green); margin-top: 10px; }
    .card dd { margin: 2px 0 0; }
    .card ul { margin: 4px 0 0; padding-left: 1.2em; }
    .card li { margin: 2px 0; }
    .sub { font-size: 14px; color: var(--muted); }
    .note { margin-top: 12px; padding: 8px 12px; background: #f2f6ef; border-radius: 8px; font-size: 14px; }
    .empty { color: var(--muted); padding: 18px 4px; }

    .problems { display: grid; gap: 10px; margin-top: 8px; }
    .problem { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; color: var(--ink); width: 100%; }
    .problem:hover { border-color: #e3a59b; }
    .problem[aria-pressed="true"] { border-color: var(--i); box-shadow: 0 0 0 3px #c0392b22; background: #fff8f6; }
    .problem .bad { font-weight: 700; }
    .problem .hurt { color: var(--i); font-weight: 700; }
    .problem p { margin: 4px 0 0; font-size: 14.5px; }
    .problem .fix { color: var(--green); }
    .peek { margin-top: 10px; padding: 10px 12px; border: 1px dashed #b9cdb9; border-radius: 10px; background: #fbfdf9; font-size: 14.5px; }
    .peek b { color: var(--green); }
    .src { margin-top: 28px; font-size: 13px; color: var(--muted); }
    .src a { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <a class="back" href="index.html">← 人體與復健</a>
  <h1>人體部位圖</h1>
  <p class="lead">點人體圖或下方名稱，認識肌肉、骨骼的位置與功能；看復健運動、各種運動用到哪裡，姿勢錯了容易傷到哪裡。</p>
  <p class="disclaimer">內容為一般衛教參考，不能取代醫師或物理治療師的評估。實際的動作、角度、次數與能不能做，請依你的治療師指示；做的時候若疼痛加劇請停止。</p>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="explore" aria-selected="true">認識部位</button>
    <button role="tab" data-tab="exercise" aria-selected="false">復健運動</button>
    <button role="tab" data-tab="sport" aria-selected="false">運動與傷害</button>
  </div>

  <div class="layout">
    <div class="figure-wrap">
      <div class="figs">
        <figure><svg class="body" id="fig-front" viewBox="0 0 200 440" role="img" aria-label="人體正面"></svg><figcaption>正面</figcaption></figure>
        <figure><svg class="body" id="fig-back" viewBox="0 0 200 440" role="img" aria-label="人體背面"></svg><figcaption>背面</figcaption></figure>
      </div>
      <div class="layers" id="layers">
        <button data-layer="s" aria-pressed="true">淺層肌肉</button>
        <button data-layer="d" aria-pressed="false">深層肌肉</button>
        <button data-layer="b" aria-pressed="false">骨骼・韌帶</button>
      </div>
      <div class="legend" id="legend"></div>
      <p class="hint" id="hint">示意圖，比例與形狀經過簡化；左右兩側的肌肉相同。</p>
    </div>
    <div class="panel" id="panel"></div>
  </div>

  <p class="src">內容整理自解剖學與復健教科書常見內容，並對照 Physiopedia、StatPearls（NCBI）、Kenhub 等公開資料。</p>
</main>

<script>
// ───────────────────────── 人體結構 ─────────────────────────
// 座標：viewBox 200×440，正面與背面各一張。圖的中線 x=100，只畫右半邊（x≥100），程式自動鏡射到左半邊；
// mid:true 的形狀在中線上（胸骨、脊椎），不鏡射。
// 每個結構依圖層放形狀：s 淺層肌肉、d 深層肌肉、b 骨骼・韌帶；f 正面、k 背面。陣列順序就是繪圖順序（後畫的蓋在上面）。
const STRUCTS = [
  // ── 骨骼 ──
  { id: 'ribs', name: '肋骨', en: 'Ribs', kind: '骨骼', group: '骨骼',
    where: '胸廓兩側共 12 對，後面接胸椎，前面上 7 對經各自的肋軟骨直接接到胸骨，第 8–10 對的肋軟骨先接到上一條肋軟骨、再間接連到胸骨（第 11、12 對是浮肋）。',
    does: '保護心肺，呼吸時跟著起伏；前鋸肌、腹外斜肌、胸小肌等都附著在肋骨上。',
    tips: '肩胛骨是「浮」在背面肋骨上滑動的，肩胛胸廓關節沒有真正的關節面，要靠肌肉把它穩住。',
    b: { f: ['M103,88 C118,88 128,96 130,110 C132,126 130,144 124,156 C118,160 110,156 103,150 Z'],
         k: ['M103,88 C118,88 128,96 130,110 C132,126 130,144 124,156 C118,160 110,156 103,150 Z'] },
    deco: { b: { f: ['M103,100 C114,99 124,103 128,110', 'M103,112 C115,111 126,116 130,124', 'M103,124 C115,124 126,130 129,138', 'M103,136 C114,137 122,142 126,148'],
                 k: ['M103,100 C114,99 124,103 128,110', 'M103,112 C115,111 126,116 130,124', 'M103,124 C115,124 126,130 129,138', 'M103,136 C114,137 122,142 126,148'] } } },
  { id: 'sternum', name: '胸骨', en: 'Sternum', kind: '骨骼', group: '骨骼', mid: true,
    where: '胸口正中央的扁平骨，上端有胸骨柄（兩側接鎖骨），下端是劍突。',
    does: '連接鎖骨與肋骨，構成胸廓前面；胸大肌、胸鎖乳突肌、腹直肌都有附著在胸骨。',
    tips: '胸鎖關節是整隻手臂和軀幹唯一的骨頭接點。',
    b: { f: ['M97,84 L103,84 L103,126 L100,134 L97,126 Z'] } },
  { id: 'clavicle', name: '鎖骨', en: 'Clavicle', kind: '骨骼', group: '骨骼',
    where: '肩膀前面、脖子下方摸得到的橫向長骨，內側接胸骨，外側接肩胛骨的肩峰。',
    does: '像撐竿一樣把肩膀撐在身體外側；手臂上舉時鎖骨也會跟著上抬、旋轉。',
    tips: '跌倒手撐地或肩膀著地常見骨折的部位；肩鎖關節（AC joint）就在鎖骨外端。',
    b: { f: ['M102,82 C114,84 126,83 143,87 L143,90 C126,87 114,88 102,86 Z'] } },
  { id: 'scapula', name: '肩胛骨', en: 'Scapula', kind: '骨骼', group: '骨骼',
    where: '背部上方兩側的三角形扁骨，大約在第 2 到第 7 肋骨的高度，貼在肋骨後面。後面有一條橫的骨脊叫「肩胛棘」，往外延伸成肩峰。',
    does: '是肩關節的「底座」：外側的關節盂和肱骨頭組成肩關節。肩胛骨可以上提／下壓、前伸／後收、上旋／下旋、前傾／後傾，手臂上舉時肩胛骨會跟著上旋（肩肱節律：手臂每舉高約 3 度，大約 2 度來自肩關節本身、1 度來自肩胛骨上旋）。',
    tips: '肩胛骨的位置和動作控制是肩膀復健的重點。肩胛骨內緣浮起來叫「翼狀肩胛」，常和前鋸肌無力有關。有 17 條肌肉附著在肩胛骨上。',
    b: { k: ['M121,93 C128,91 136,90 142,92 L144,100 C142,106 141,110 140,114 C136,124 130,136 126,148 L123,146 C122,130 121,112 121,93 Z'] },
    deco: { b: { k: ['M121,104 L147,92'] } } },
  { id: 'acromion', name: '肩峰', en: 'Acromion', kind: '骨骼', group: '骨骼',
    where: '肩胛棘往外延伸到肩膀最頂端的骨突，摸肩膀最外上方硬硬的那一塊就是。',
    does: '和鎖骨組成肩鎖關節；三角肌中束從這裡出發。肩峰下方的空間（肩峰下空間）有棘上肌肌腱和滑液囊通過。',
    tips: '手臂上舉時如果肱骨頭往上頂、肩胛骨沒有好好上旋，肩峰下空間的組織可能較容易受刺激，就是常聽到的「肩夾擠」（現在也常稱為「肩峰下疼痛症候群」）。',
    b: { f: ['M138,86 L147,88 L148,93 L139,91 Z'], k: ['M140,88 L148,89 L149,94 L141,94 Z'] } },
  { id: 'humerus', name: '肱骨', en: 'Humerus', kind: '骨骼', group: '骨骼',
    where: '上臂的長骨，上端圓圓的肱骨頭接在肩胛骨的關節盂，下端接前臂組成手肘。',
    does: '肩關節（盂肱關節）是球窩關節：球大、窩淺，所以活動度最大，但也最需要旋轉肌袖把肱骨頭穩在關節盂裡。',
    tips: '肱骨頭上的大結節是棘上肌、棘下肌、小圓肌的附著處；小結節是肩胛下肌的附著處。',
    b: { f: ['M137,96 C141,93 146,94 147,99 C148,120 150,148 152,168 L147,170 C144,148 142,122 140,104 C137,103 136,99 137,96 Z'],
         k: ['M137,96 C141,93 146,94 147,99 C148,120 150,148 152,168 L147,170 C144,148 142,122 140,104 C137,103 136,99 137,96 Z'] } },
  { id: 'forearm-bones', name: '橈骨・尺骨', en: 'Radius & Ulna', kind: '骨骼', group: '骨骼',
    where: '前臂的兩根骨頭：大拇指側是橈骨，小指側是尺骨。',
    does: '橈骨繞著尺骨轉動，讓手掌可以翻上（旋後）、翻下（旋前）。',
    tips: '肱骨外上髁（手肘外側）是伸腕肌群的共同起點，網球肘痛的位置就在這附近；內上髁是屈腕肌群的起點（高爾夫球肘）。',
    b: { f: ['M147,174 L153,173 C157,190 160,206 161,224 L156,225 C153,206 150,190 147,174 Z'],
         k: ['M147,174 L153,173 C157,190 160,206 161,224 L156,225 C153,206 150,190 147,174 Z'] } },
  { id: 'cervical', name: '頸椎', en: 'Cervical spine (C1–C7)', kind: '骨骼', group: '骨骼', mid: true,
    where: '脖子的 7 節脊椎（C1–C7），低頭時後頸最突出的那一節通常是 C7。',
    does: '支撐頭部並讓頭轉動、點頭、側彎；正常有往前凸的弧度（頸椎前凸）。',
    tips: '長時間低頭、頭往前伸會增加頸椎與後頸肌肉的負擔。',
    b: { k: ['M98,58 L102,58 L102,84 L98,84 Z'] },
    deco: { b: { k: ['M98,64 L102,64', 'M98,70 L102,70', 'M98,76 L102,76'] } } },
  { id: 'thoracic', name: '胸椎', en: 'Thoracic spine (T1–T12)', kind: '骨骼', group: '骨骼', mid: true,
    where: '背部中段的 12 節脊椎（T1–T12），每一節都接一對肋骨。',
    does: '主要負責旋轉，正常有往後凸的弧度（胸椎後凸）。',
    tips: '胸椎太僵硬、駝背時，手臂要舉高會比較困難，肩膀也比較容易代償。',
    b: { k: ['M98,86 L102,86 L102,170 L98,170 Z'] },
    deco: { b: { k: ['M98,96 L102,96', 'M98,107 L102,107', 'M98,118 L102,118', 'M98,129 L102,129', 'M98,140 L102,140', 'M98,151 L102,151', 'M98,162 L102,162'] } } },
  { id: 'lumbar', name: '腰椎', en: 'Lumbar spine (L1–L5)', kind: '骨骼', group: '骨骼', mid: true,
    where: '下背的 5 節脊椎（L1–L5），是最粗、承重最多的脊椎。',
    does: '主要負責彎腰、後仰；正常有往前凸的弧度（腰椎前凸）。',
    tips: '下背痛最常見的部位。搬重物時腰椎反覆彎曲＋負重，會增加椎間盤和下背肌肉的負擔。',
    b: { k: ['M97.5,172 L102.5,172 L102.5,208 L97.5,208 Z'] },
    deco: { b: { k: ['M97.5,179 L102.5,179', 'M97.5,186 L102.5,186', 'M97.5,193 L102.5,193', 'M97.5,200 L102.5,200'] } } },
  { id: 'pelvis', name: '骨盆（髂骨）', en: 'Pelvis / Ilium', kind: '骨骼', group: '骨骼',
    where: '腰下方像臉盆的骨頭，由兩側的髖骨（髂骨、坐骨、恥骨）和後面的薦骨、尾骨組成。叉腰時摸到的骨頭邊緣是髂嵴，前面突出的是髂前上棘（ASIS）。',
    does: '把上半身的重量傳到兩腳，臀肌、髂腰肌、腹肌、大腿肌都附著在骨盆上。',
    tips: '「骨盆前傾／後傾」是指骨盆往前或往後轉，會連動腰椎的弧度。單腳站時，抬起那一側的骨盆往下掉，通常代表「支撐腳那一側」的臀中肌控制不足。',
    b: { f: ['M104,184 C112,178 126,178 133,184 C137,190 136,196 133,200 L128,206 C127,212 125,216 122,218 L114,224 C108,226 104,226 100,226 L100,216 C104,214 108,210 110,206 C108,200 105,194 104,190 Z'],
         k: ['M104,190 C112,184 124,182 132,186 C137,192 137,202 134,210 C128,216 120,220 112,222 L105,222 Z'] } },
  { id: 'sacrum', name: '薦椎（薦骨）', en: 'Sacrum', kind: '骨骼', group: '骨骼', mid: true,
    where: '腰椎下方、骨盆後面中間的倒三角形骨頭，由 5 節薦椎癒合而成。',
    does: '和兩側髂骨組成薦髂關節，是脊椎和骨盆的連接點。',
    tips: '臀大肌、梨狀肌、多裂肌都有附著在薦骨。',
    b: { k: ['M95,210 L105,210 L102,232 L100,236 L98,232 Z'] } },

const SILHOUETTE = 'M100,58 L108,58 C109,66 110,72 112,77 C122,81 134,84 143,88 C151,91 155,100 155,112 C155,122 154,130 154,138 C156,150 158,162 159,172 C162,186 165,204 165,224 C168,232 170,246 167,258 C165,266 158,268 155,262 C152,252 151,240 152,228 C150,212 147,196 145,180 C144,172 143,164 142,156 C141,144 139,132 136,122 L131,120 C130,136 128,150 127,164 C127,176 132,190 137,204 C139,216 139,232 137,252 C135,276 132,298 131,316 C131,326 134,338 134,352 C133,370 128,388 125,404 C127,412 130,420 129,426 C124,430 112,431 107,428 C105,420 106,412 107,404 C106,388 104,370 104,352 C104,340 106,330 106,320 C105,300 104,270 103,250 C102,240 101,232 100,228';
const MIRROR = 'matrix(-1 0 0 1 200 0)';
const FILL = { s: 'var(--muscle)', d: 'var(--deep)', b: 'var(--bone)' };
const LINE = { s: 'var(--muscle-line)', d: 'var(--muscle-line)', b: 'var(--bone-line)' };
const HL_COLOR = { sel: 'var(--sel)', p: 'var(--p)', s: 'var(--s)', w: 'url(#hatch)', x: 'var(--x)', t: 'var(--t)', u: 'var(--u)', i: 'var(--i)' };

function fillOf(st, layer) {
  if (st.kind === '肌腱' || st.kind === '筋膜') return 'var(--tendon)';
  if (st.kind === '韌帶') return '#e9dcae';
  if (st.kind === '骨骼') return 'var(--bone)';
  return FILL[layer];
}

function addPath(g, d, attrs, mirror, mid) {
  const make = transform => {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    for (const [k, v] of Object.entries(attrs)) p.setAttribute(k, v);
    if (transform) p.setAttribute('transform', transform);
    g.appendChild(p);
  };
  make(null);
  if (mirror && !mid) make(MIRROR);
}

function drawLayer(g, view, layer, opts) {
  // opts: { hl: Map id→class, pale: bool, ghost: bool, selected }
  for (const st of STRUCTS) {
    const shapes = st[layer]?.[view];
    if (!shapes) continue;
    const cls = opts.hl?.get(st.id) || (opts.selected === st.id ? 'sel' : null);
    const fill = cls ? HL_COLOR[cls] : (opts.pale ? 'var(--pale)' : fillOf(st, layer));
    const stroke = cls ? '#00000055' : (opts.pale ? 'var(--pale-line)' : LINE[layer]);
    const attrs = { class: 'r' + (opts.ghost && !cls ? ' ghost' : ''), 'data-id': st.id, fill, stroke };
    if (st.dashed) Object.assign(attrs, { 'stroke-dasharray': '2 1.2', 'stroke-width': '.8' });
    for (const d of shapes) addPath(g, d, attrs, true, st.mid);
    for (const d of st.deco?.[layer]?.[view] || []) addPath(g, d, { class: 'deco' }, true, st.mid);
  }
}

// 高亮模式：先畫淺層（淡色），再把「不在淺層」的高亮結構用虛線疊在上面，標示它在深處。
function drawOverlay(g, view, hl) {
  for (const st of STRUCTS) {
    const cls = hl.get(st.id);
    if (!cls || st.s?.[view]) continue;
    const layer = st.d?.[view] ? 'd' : st.b?.[view] ? 'b' : null;
    if (!layer) continue;
    const attrs = { class: 'r', 'data-id': st.id, fill: HL_COLOR[cls], 'fill-opacity': '.85', stroke: '#00000088', 'stroke-dasharray': '2 1.2', 'stroke-width': '.8' };
    for (const d of st[layer][view]) addPath(g, d, attrs, true, st.mid);
  }
}

function renderFigure(svg, view) {
  svg.textContent = '';
  const defs = document.createElementNS(SVGNS, 'defs');
  defs.innerHTML = '<pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#efeafa"/><rect width="1.4" height="3" fill="#7a5bc0"/></pattern>';
  svg.appendChild(defs);
  const g = document.createElementNS(SVGNS, 'g');
  svg.appendChild(g);
  // 身體外形與頭
  addPath(g, SILHOUETTE, { fill: 'var(--skin)', stroke: 'none' }, true);
  addPath(g, SILHOUETTE, { fill: 'none', stroke: 'var(--skin-line)', 'stroke-width': '.8' }, true);
  const head = document.createElementNS(SVGNS, 'ellipse');
  Object.entries({ cx: 100, cy: 34, rx: 18, ry: 24, fill: view === 'k' ? '#d9c6b5' : 'var(--skin)', stroke: 'var(--skin-line)', 'stroke-width': '.8' }).forEach(([k, v]) => head.setAttribute(k, v));
  g.appendChild(head);

  if (state.tab === 'explore') {
    if (state.layer === 's') drawLayer(g, view, 's', { selected: state.selected });
    if (state.layer === 'd') { drawLayer(g, view, 'b', { ghost: true, selected: state.selected }); drawLayer(g, view, 'd', { selected: state.selected }); }
    if (state.layer === 'b') drawLayer(g, view, 'b', { selected: state.selected });
  } else {
    const hl = currentHighlights();
    drawLayer(g, view, 's', { hl, pale: true });
    drawOverlay(g, view, hl);
  }
}

// ───────────────────────── 狀態與介面 ─────────────────────────
const state = { tab: 'explore', layer: 's', selected: null, exercise: 'retract-scaption', sport: 'run', problem: null, peek: null };
const panel = document.getElementById('panel');
const $ = (sel, root = document) => root.querySelector(sel);

function layersOf(st) { return ['s', 'd', 'b'].filter(l => st[l]); }
function layerName(l) { return { s: '淺層', d: '深層', b: '骨骼' }[l]; }

function currentHighlights() {
  const hl = new Map();
  const put = (ids, cls) => (ids || []).forEach(id => { if (!hl.has(id)) hl.set(id, cls); });
  if (state.tab === 'exercise') {
    const ex = EXERCISES.find(e => e.id === state.exercise);
    put(ex.p, 'p'); put(ex.s, 's'); put(ex.w, 'w'); put(ex.x, 'x');
  } else if (state.tab === 'sport') {
    const sp = SPORTS.find(s => s.id === state.sport);
    if (state.problem != null) put(sp.problems[state.problem].areas, 'i');
    else { put(sp.t, 't'); put(sp.u, 'u'); }
  }
  return hl;
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
  document.getElementById('layers').hidden = state.tab !== 'explore';
  document.querySelectorAll('#layers button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layer === state.layer)));
  renderFigure(document.getElementById('fig-front'), 'f');
  renderFigure(document.getElementById('fig-back'), 'k');
  renderLegend();
  if (state.tab === 'explore') renderExplore();
  if (state.tab === 'exercise') renderExercise();
  if (state.tab === 'sport') renderSport();
}

function renderLegend() {
  const items = state.tab === 'exercise'
    ? [['var(--p)', '主要用到'], ['var(--s)', '協同幫忙'], ['dash', '容易代償'], ['var(--x)', '伸展到']]
    : state.tab === 'sport'
      ? (state.problem != null ? [['var(--i)', '可能受傷的部位']] : [['var(--t)', '主要練到'], ['var(--u)', '也會用到']])
      : [];
  const legend = document.getElementById('legend');
  legend.innerHTML = items.map(([c, t]) => c === 'dash' ? `<span><i class="dash"></i>${t}</span>` : `<span><i style="background:${c}"></i>${t}</span>`).join('')
    + (state.tab !== 'explore' ? '<span>虛線＝在深處／骨骼</span>' : '');
}

function chip(id, cls, pressed) {
  const st = BY_ID[id];
  return `<button class="chip${cls ? ' c-' + cls : ''}" data-id="${id}"${pressed != null ? ` aria-pressed="${pressed}"` : ''}>${st.name}</button>`;
}

function infoHtml(st, full) {
  const exs = EXERCISES.filter(e => [e.p, e.s, e.x].some(l => l?.includes(st.id)));
  const sps = SPORTS.filter(s => [s.t, s.u].some(l => l?.includes(st.id)));
  const hurts = SPORTS.flatMap(s => s.problems.map((p, i) => ({ s, p, i }))).filter(({ p }) => p.areas.includes(st.id));
  return `<h2>${st.name}<span class="en">${st.en}</span><span class="badge">${st.kind}</span></h2>
    <dl><dt>在哪裡</dt><dd>${st.where}</dd><dt>做什麼</dt><dd>${st.does}</dd><dt>復健・運動重點</dt><dd>${st.tips}</dd>
    ${full && exs.length ? `<dt>會用到它的復健運動</dt><dd class="chips">${exs.map(e => `<button class="chip" data-go-ex="${e.id}">${e.name}</button>`).join('')}</dd>` : ''}
    ${full && sps.length ? `<dt>會練到它的運動</dt><dd class="chips">${sps.map(s => `<button class="chip" data-go-sp="${s.id}">${s.name}</button>`).join('')}</dd>` : ''}
    ${full && hurts.length ? `<dt>姿勢不對時可能受傷</dt><dd class="chips">${hurts.map(({ s, p, i }) => `<button class="chip c-i" data-go-sp="${s.id}" data-go-pr="${i}">${s.name}：${p.hurt.split('、')[0]}</button>`).join('')}</dd>` : ''}
    </dl>`;
}

function renderExplore() {
  const groups = GROUPS.map(g => {
    const items = STRUCTS.filter(s => s.group === g);
    return `<div class="group"><h3>${g}</h3><div class="chips">${items.map(st => {
      const ls = layersOf(st);
      const tag = g === '骨骼' || g === '韌帶' ? '' : `<small>${ls.includes('s') ? '' : '深層'}</small>`;
      return `<button class="chip" data-id="${st.id}" aria-pressed="${state.selected === st.id}">${st.name}${tag}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  const st = BY_ID[state.selected];
  panel.innerHTML = (st ? `<div class="card" style="margin-top:0;margin-bottom:14px">${infoHtml(st, true)}</div>` : `<p class="empty" style="padding-top:0">點人體圖上的部位或下面的名稱看說明。切換「淺層／深層／骨骼」看不同深度：例如棘上肌、菱形肌被斜方肌蓋住，要切到「深層肌肉」才看得到。</p>`) + groups;
}

function renderExercise() {
  const ex = EXERCISES.find(e => e.id === state.exercise);
  const groups = [...new Set(EXERCISES.map(e => e.group))].map(g => `<div class="group"><h3>${g}</h3><div class="chips">${EXERCISES.filter(e => e.group === g).map(e => `<button class="chip" data-ex="${e.id}" aria-pressed="${e.id === state.exercise}">${e.name}</button>`).join('')}</div></div>`).join('');
  const list = (label, ids, cls) => ids?.length ? `<dt>${label}</dt><dd class="chips">${ids.map(id => chip(id, cls)).join('')}</dd>` : '';
  panel.innerHTML = groups + `<div class="card">
    <h2>${ex.name}</h2><p class="sub">${ex.group}</p>
    <dl><dt>怎麼做</dt><dd>${ex.how}</dd>
    ${list('主要用到', ex.p, 'p')}${list('協同幫忙', ex.s, 's')}${list('容易代償（要避免它搶著出力）', ex.w, 'w')}${list('伸展到', ex.x, 'x')}
    </dl><div id="peek"></div>
    <dl><dt>動作要點</dt><dd><ul>${ex.cues.map(c => `<li>${c}</li>`).join('')}</ul></dd>
    <dt>常見錯誤</dt><dd><ul>${ex.mistakes.map(c => `<li>${c}</li>`).join('')}</ul></dd></dl>
    ${ex.note ? `<div class="note">${ex.note}</div>` : ''}
    <p class="sub" style="margin:10px 0 0">點肌肉名稱可以看它的位置與功能。</p></div>`;
  renderPeek();
}

function renderSport() {
  const sp = SPORTS.find(s => s.id === state.sport);
  const list = (label, ids, cls) => ids?.length ? `<dt>${label}</dt><dd class="chips">${ids.map(id => chip(id, cls)).join('')}</dd>` : '';
  panel.innerHTML = `<div class="group"><div class="chips">${SPORTS.map(s => `<button class="chip" data-sp="${s.id}" aria-pressed="${s.id === state.sport}">${s.name}</button>`).join('')}</div></div>
    <div class="card"><h2>${sp.name}</h2>
    <dl><dd style="margin-top:6px">${sp.summary}</dd>${list('主要練到', sp.t, 't')}${list('也會用到', sp.u, 'u')}</dl>
    <div id="peek"></div>
    <dl><dt>姿勢不正確，可能傷到哪裡？<span class="sub" style="font-weight:400">（點一下在圖上看位置）</span></dt></dl>
    <div class="problems">${sp.problems.map((p, i) => `<button class="problem" data-pr="${i}" aria-pressed="${state.problem === i}">
      <div class="bad">✗ ${p.bad}</div><p>→ <span class="hurt">${p.hurt}</span></p><p>${p.why}</p><p class="fix">✓ ${p.fix}</p></button>`).join('')}</div>
    ${sp.note ? `<div class="note">${sp.note}</div>` : ''}</div>`;
  renderPeek();
}

function renderPeek() {
  const box = document.getElementById('peek');
  if (!box) return;
  const st = BY_ID[state.peek];
  box.className = st ? 'peek' : '';
  box.innerHTML = st ? `<b>${st.name}</b>（${st.en}）<br>${st.where}<br><b>做什麼：</b>${st.does}` : '';
}

function select(id) {
  const st = BY_ID[id];
  if (!st) return;
  if (state.tab === 'explore') {
    if (!st[state.layer]) state.layer = layersOf(st)[0];
    state.selected = state.selected === id ? null : id;
    render();
    if (state.selected && matchMedia('(max-width: 899px)').matches) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    state.peek = state.peek === id ? null : id;
    renderPeek();
  }
}

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab; state.peek = null; state.problem = null;
  render();
});
document.getElementById('layers').addEventListener('click', e => {
  const b = e.target.closest('button[data-layer]');
  if (!b) return;
  state.layer = b.dataset.layer;
  if (state.selected && !BY_ID[state.selected][state.layer]) state.selected = null;
  render();
});
document.querySelector('.figs').addEventListener('click', e => {
  const p = e.target.closest('[data-id]');
  if (p) select(p.dataset.id);
});
panel.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.goEx) { state.tab = 'exercise'; state.exercise = t.dataset.goEx; state.peek = null; render(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.dataset.goSp) { state.tab = 'sport'; state.sport = t.dataset.goSp; state.problem = t.dataset.goPr != null ? Number(t.dataset.goPr) : null; state.peek = null; render(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.dataset.ex) { state.exercise = t.dataset.ex; state.peek = null; render(); return; }
  if (t.dataset.sp) { state.sport = t.dataset.sp; state.problem = null; state.peek = null; render(); return; }
  if (t.dataset.pr != null) { const i = Number(t.dataset.pr); state.problem = state.problem === i ? null : i; render(); if (state.problem != null && matchMedia('(max-width: 899px)').matches) document.querySelector('.figure-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.id) select(t.dataset.id);
});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
</script>
</body>
</html>
