<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#23695c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <title>歌詞學習・銀色の矢</title>
  <style>
    :root { --ink: #253e3b; --muted: #64756f; --green: #23695c; --paper: #fffdf8; --line: #e2e7dc; --kanji-rt: #2f6f8f; --kata-rt: #b4682a; }
    * { box-sizing: border-box; }
    /* 連點時不會雙擊放大；橫向時 iOS 不會自動放大字。 */
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; background: #f5f3eb; color: var(--ink); font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; line-height: 1.7; }
    button, select { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #d48b38; outline-offset: 3px; }
    main { width: min(1160px, calc(100% - 48px)); margin: 32px auto 48px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 46px); letter-spacing: .04em; line-height: 1.3; }
    .lead { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

    /* 播放設定只在頁首，捲動時不跟著走，學習時畫面留給單字。 */
    .player { margin-top: 18px; }
    .player-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    #play-all { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 12px 26px 12px 20px; background: var(--green); color: #fff; font-size: 18px; font-weight: 700; box-shadow: 0 6px 18px #23695c33; }
    /* 文字固定 4 字寬，「全部播放」↔「停止」切換時按鈕不會變寬變窄。 */
    #play-all .label { display: inline-block; min-width: 4em; text-align: left; }
    #play-all .icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #ffffff2e; font-size: 14px; }
    #play-all[aria-pressed="true"] { background: #b3402f; box-shadow: 0 6px 18px #b3402f33; }
    .audio-controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: 14px; }
    .field { display: inline-flex; align-items: center; gap: 8px 10px; }
    select, .toggle { border: 1px solid #ced8cc; background: var(--paper); color: var(--ink); border-radius: 8px; padding: 7px 11px; }
    #voice { max-width: 220px; }
    .toggle { font-size: 14px; }
    .toggle[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
    /* 底部播放條：只在連續播放時出現，隨時可以停止。 */
    .mini { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, calc((100% - 1160px) / 2)); background: #f5f3ebf2; backdrop-filter: blur(6px); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px #344e3b14; }
    .mini[hidden] { display: none; }
    /* 左邊大按鈕是暫停／繼續（拇指最好按），右邊小按鈕才是結束播放。 */
    #mini-pause { flex: none; min-width: 6.5em; min-height: 40px; border: 0; border-radius: 999px; padding: 6px 16px; background: var(--green); color: #fff; font-size: 15px; font-weight: 700; }
    #mini-stop { flex: none; min-height: 40px; border: 1px solid #d9b3ab; border-radius: 999px; padding: 6px 14px; background: var(--paper); color: #b3402f; font-size: 14px; font-weight: 600; }
    .mini-info { flex: 1; min-width: 0; }
    .now { margin: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now strong { color: var(--ink); }
    .bar { height: 3px; border-radius: 3px; background: #e2e7dc; overflow: hidden; margin-top: 4px; }
    .bar > i { display: block; height: 100%; width: 0; background: #74a984; transition: width .3s; }
    /* 播放中自動捲到的卡片不要被底部播放條蓋住。 */
    html { scroll-padding-bottom: 80px; }
    body.playing main { margin-bottom: 96px; }


    nav.cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
    nav.cats button { color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font-size: 14px; }
    nav.cats button:hover { border-color: #a9c2ad; }
    nav.cats small { color: var(--muted); margin-left: 4px; }
    nav.cats button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
    nav.cats button[aria-pressed="true"] small { color: #ffffffc0; }

    section { margin-top: 30px; scroll-margin-top: 16px; }
    .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 22px; letter-spacing: .03em; }
    .sec-head p { margin: 0; color: var(--muted); font-size: 14px; flex: 1 1 260px; }
    .play-cat { border: 1px solid #b9cdb9; background: var(--paper); color: var(--green); border-radius: 999px; padding: 3px 14px; font-size: 14px; font-weight: 600; }
    .play-cat[aria-pressed="true"] { background: #b3402f; border-color: #b3402f; color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); padding: 14px 16px; min-height: 130px; transition: border-color .15s, box-shadow .15s, background .15s; }
    .card:hover { border-color: #a9c2ad; box-shadow: 0 4px 14px #344e3b10; }
    .card.wide { grid-column: span 2; }
    .card.speaking { border-color: var(--green); background: #eef6ee; box-shadow: 0 0 0 3px #23695c33; }
    .jp { font-size: 36px; line-height: 2.1; font-weight: 600; letter-spacing: .02em; word-break: keep-all; overflow-wrap: anywhere; }
    .card.long .jp { font-size: 28px; }
    ruby { ruby-position: over; ruby-align: center; }
    rt { font-size: .5em; font-weight: 600; letter-spacing: 0; color: var(--kanji-rt); }
    rt.k { color: var(--kata-rt); }
    body.no-rt rt { visibility: hidden; }
    body.no-kata rt.k { visibility: hidden; }
    .zh { font-size: 17px; font-weight: 600; color: #365b45; line-height: 1.45; }
    body.no-zh .zh, body.no-zh .note { visibility: hidden; }
    .note { font-size: 14.5px; color: var(--muted); line-height: 1.5; margin-top: 3px; }
    /* 歌詞一句一張，整行寬。 */
    .card.line { grid-column: 1 / -1; min-height: 0; }
    .card.line .jp { font-size: 32px; line-height: 2.3; }
    /* 文法卡：上面一行是句型，下面是例句。 */
    .pat { display: inline-block; border-radius: 6px; padding: 0 8px; background: #e3efe9; color: var(--green); font-size: 15px; font-weight: 700; line-height: 1.7; }
    .card.gram .jp { font-size: 26px; }

    .status { margin: 10px 2px 0; font-size: 13px; color: #b3402f; }
    .status:empty { display: none; }
    footer { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 12px; color: var(--muted); }

    @media (max-width: 650px) {
      main { width: calc(100% - 32px); margin: 24px auto; }
      .player { margin-top: 14px; }
      .player-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
      #play-all { justify-self: start; font-size: 16px; padding: 8px 18px 8px 10px; }
      .toggles { grid-row: 1; grid-column: 2; gap: 6px; flex-wrap: nowrap; }
      .toggle { min-height: 40px; padding: 6px 12px; }
      .settings { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr; gap: 6px; }
      .field { flex-direction: column; align-items: stretch; gap: 0; min-width: 0; }
      .field label { font-size: 12px; color: var(--muted); line-height: 1.4; }
      /* iOS Safari 在字級小於 16px 的選單取得焦點時會自動放大畫面。 */
      select { font-size: 16px; width: 100%; min-width: 0; padding: 5px 8px; }
      #voice { max-width: none; }
      .now { font-size: 13px; }
      nav.cats button { padding: 6px 13px; }
      .play-cat { padding: 6px 14px; }
      /* 手機一行一張卡，長的詞也不會擠出方格。 */
      .grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .card { padding: 12px 16px; min-height: 0; }
      .card.wide { grid-column: 1 / -1; }
      .jp { font-size: 30px; }
      .card.long .jp { font-size: 24px; }
      .card.line .jp { font-size: 24px; line-height: 2.2; }
      .card.gram .jp { font-size: 21px; }
      .zh { font-size: 16px; }
      .note { font-size: 13.5px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    @media print {
      body { background: #fff; }
      main { width: 100%; margin: 0; }
      .player, .mini, nav.cats, .play-cat, .status, footer { display: none !important; }
      body.no-rt rt, body.no-kata rt.k, body.no-zh .zh, body.no-zh .note { visibility: visible; }
      .card { break-inside: avoid; min-height: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>歌詞學習・銀色の矢</h1>
    <p class="lead">四句歌詞逐句拆解：先看整句意思，再學裡面的單字和文法。點任何一張卡片聽發音，或按「全部播放」從頭念到尾。</p>

    <div class="player" id="player">
      <div class="player-row">
        <button type="button" id="play-all" aria-pressed="false"><span class="icon" aria-hidden="true">▶</span><span class="label">全部播放</span></button>
        <div class="audio-controls settings">
          <span class="field"><label for="rate">速度</label>
          <select id="rate"><option value="0.7">慢慢念</option><option value="0.9" selected>稍慢</option><option value="1">一般</option></select></span>
          <span class="field"><label for="gap">間隔</label>
          <select id="gap"><option value="400">短</option><option value="900" selected>中</option><option value="1800">長（跟著念）</option></select></span>
          <span class="field"><label for="rep">重複</label>
          <select id="rep"><option value="1">1 次</option><option value="2">2 次</option><option value="3" selected>3 次</option></select></span>
          <span class="field"><label for="voice">聲音</label>
          <select id="voice" disabled><option>正在尋找日語語音…</option></select></span>
        </div>
        <div class="audio-controls toggles">
          <button type="button" class="toggle" id="t-rt" aria-pressed="true">讀音</button>
          <button type="button" class="toggle" id="t-zh" aria-pressed="true">中文</button>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="mini" id="mini" hidden>
      <button type="button" id="mini-pause" aria-pressed="false">❚❚ 暫停</button>
      <div class="mini-info">
        <p class="now" id="now" aria-live="polite"></p>
        <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      </div>
      <button type="button" id="mini-stop">■ 停止</button>
    </div>

    <nav class="cats" id="cats" aria-label="只顯示這個分類"></nav>
    <noscript><p>請啟用 JavaScript，才能顯示歌詞與播放發音。</p></noscript>
    <div id="sections"></div>

    <footer>發音使用裝置內建的日語語音（Windows、macOS、iPhone、Android 通常都有），聲音好壞依裝置而異；念的是語音朗讀，不是歌曲旋律。漢字一律照標註的讀音念，以免語音念成別的讀法（例如「描く」念 えがく 而不是 かく）。中文翻譯是學習用的意譯。列印時讀音與中文會全部顯示。</footer>
  </main>

  <script>
    'use strict';
    // 標記方式：{漢字|讀音} 會加上平假名讀音；片假名會自動標上對應的平假名。
    // 歌詞、單字：[標記, 中文, 補充說明, 念法]；文法：[句型, 例句標記, 中文, 說明]。
    // 念法：字串＝直接念這個字串。kana: true 的分類一律念讀音，漢字不會被念成別的讀法。
    const categories = [
      { id: 'lyrics', type: 'lyrics', title: '歌詞', desc: '一句一張卡，下面是中文意思和這句的重點', kana: true, words: [
        ['{蒼|あお}い{時|とき}　{描|えが}く{軌|き}{跡|せき}{辿|たど}り', '沿著青澀時光裡描繪出的軌跡前進',
          '「{蒼|あお}い{時|とき}」＝青澀的時光；「{描|えが}く{軌|き}{跡|せき}」＝描繪出的軌跡（動詞直接修飾名詞）；「{辿|たど}り」＝{辿|たど}って，歌詞、書面語常這樣接下一句'],
        ['{答|こた}え{探|さが}す　{同|おな}じ{空|そら}　{見|み}{上|あ}げながら', '一邊仰望同一片天空，一邊尋找答案',
          '「{答|こた}え{探|さが}す」省略了助詞 を（＝{答|こた}えを{探|さが}す），歌詞常省略助詞；「〜ながら」＝一邊…一邊…'],
        ['{胸|むね}に{秘|ひ}めた{想|おも}い　{溢|あふ}れ{出|だ}し', '深藏在心中的思念滿溢而出',
          '「{胸|むね}に{秘|ひ}めた」＝藏在心裡的，修飾後面的「{想|おも}い」；「{溢|あふ}れ{出|だ}し」＝{溢|あふ}れ{出|だ}して，接到下一句'],
        ['{空|そら}を{翔|か}けて　{銀|ぎん}{色|いろ}の{矢|や}に{変|か}わる', '翱翔天際，化作一支銀色的箭',
          '「{空|そら}を」的 を 表示飛過的地方；「〜に{変|か}わる」＝變成〜'],
      ]},
      { id: 'vocab', title: '單字', desc: '歌詞裡出現的詞，動詞用原形（字典形）列出', kana: true, words: [
        ['{蒼|あお}い', '蒼藍的；青澀的', '「{青|あお}い」的文學寫法，常帶有年輕、還不成熟的感覺'],
        ['{時|とき}', '時候、時光', '「〜{時|じ}」念 じ 是「幾點」'],
        ['{描|えが}く', '描繪', '同一個字也念 かく（畫圖）。描繪夢想、軌跡多念 えがく'],
        ['{軌|き}{跡|せき}', '軌跡', '走過、飛過留下的路線，也比喻人生的足跡'],
        ['{辿|たど}る', '沿著…前進；追尋', '例：{記|き}{憶|おく}を{辿|たど}る＝追溯記憶'],
        ['{答|こた}え', '答案、回答', '動詞是「{答|こた}える」（回答）'],
        ['{探|さが}す', '尋找'],
        ['{同|おな}じ', '相同的', '接名詞時直接放前面，不加 の：{同|おな}じ{空|そら}'],
        ['{空|そら}', '天空'],
        ['{見|み}{上|あ}げる', '仰望、抬頭看', '{見|み}る（看）＋{上|あ}げる（往上）'],
        ['{胸|むね}', '胸口；心裡', '日文常用「胸」表示內心的感情'],
        ['{秘|ひ}める', '藏在心裡', '把想法、感情藏起來不說出口'],
        ['{想|おも}い', '思念、心意', '「{思|おも}い」的感情寫法，歌詞很常見'],
        ['{溢|あふ}れる', '滿出來、溢出', '例：{涙|なみだ}が{溢|あふ}れる＝淚水滿溢'],
        ['{溢|あふ}れ{出|だ}す', '湧出來、滿溢而出', '{溢|あふ}れる＋{出|だ}す（開始、…出來）'],
        ['{翔|か}ける', '飛翔', '同音的「{駆|か}ける」是奔跑'],
        ['{銀|ぎん}{色|いろ}', '銀色'],
        ['{矢|や}', '箭', '弓是「{弓|ゆみ}」'],
        ['{変|か}わる', '改變、變成', '自己變了用「{変|か}わる」，把東西改變用「{変|か}える」'],
      ]},
      { id: 'grammar', type: 'grammar', title: '文法', desc: '歌詞用到的句型，例句是另外寫的生活簡單句', kana: true, words: [
        ['〜ながら', '{音|おん}{楽|がく}を{聞|き}きながら、{勉|べん}{強|きょう}します', '一邊聽音樂，一邊讀書',
          '動詞ます形去掉ます＋ながら＝一邊…一邊…。歌詞：{見|み}{上|あ}げながら'],
        ['動詞＋名詞', 'これは{母|はは}が{作|つく}ったケーキです', '這是媽媽做的蛋糕',
          '動詞原形或た形直接放在名詞前面，就能修飾名詞，不用加 の。歌詞：{描|えが}く{軌|き}{跡|せき}、{秘|ひ}めた{想|おも}い'],
        ['場所＋に', 'かばんに{本|ほん}を{入|い}れます', '把書放進包包',
          'に 表示東西放到、留在哪裡。歌詞：{胸|むね}に{秘|ひ}めた＝藏在心裡'],
        ['ます形＋{出|だ}す', '{急|きゅう}に{雨|あめ}が{降|ふ}り{出|だ}しました', '突然下起雨來了',
          '動詞ます形去掉ます＋{出|だ}す＝開始…、…出來。歌詞：{溢|あふ}れ{出|だ}す'],
        ['ます形で句子相連', '{駅|えき}まで{歩|ある}き、{電|でん}{車|しゃ}に{乗|の}ります', '走到車站，再搭電車',
          '動詞ます形去掉ます，就能像「〜て」一樣接下一句，書面語、歌詞常用。歌詞：{辿|たど}り、{溢|あふ}れ{出|だ}し'],
        ['場所＋を＋移動', '{鳥|とり}が{空|そら}を{飛|と}んでいます', '鳥在天空飛',
          '飛、走、過等移動動詞前的 を，表示經過的地方。歌詞：{空|そら}を{翔|か}けて'],
        ['ＡがＢに{変|か}わる', '{信|しん}{号|ごう}が{青|あお}に{変|か}わりました', '紅綠燈變成綠燈了',
          '＝Ａ變成Ｂ。日本把綠燈叫「{青|あお}」。歌詞：{銀|ぎん}{色|いろ}の{矢|や}に{変|か}わる'],
      ]},
    ];

    // ---------- 讀音處理 ----------
    const KATA = /[ァ-ヺー・]+/g;
    const toHira = (s) => [...s].map((c) => {
      const code = c.charCodeAt(0);
      if (c === '・') return '';
      return code >= 0x30A1 && code <= 0x30F6 ? String.fromCharCode(code - 0x60) : c;
    }).join('');
    // 把標記拆成 [文字, 讀音, 種類] 片段；種類：kanji 有標漢字讀音、kata 片假名、plain 不加讀音。
    function parse(markup) {
      const parts = [];
      const re = /\{([^|}]+)\|([^}]+)\}/g;
      let last = 0, m;
      const pushPlain = (text) => {
        let i = 0;
        for (const k of text.matchAll(KATA)) {
          if (k.index > i) parts.push([text.slice(i, k.index), null, 'plain']);
          // 在「・」後切段，長的外來語才能在手機上換行。
          for (const chunk of k[0].split(/(?<=・)/)) parts.push([chunk, toHira(chunk), 'kata']);
          i = k.index + k[0].length;
        }
        if (i < text.length) parts.push([text.slice(i), null, 'plain']);
      };
      while ((m = re.exec(markup))) {
        if (m.index > last) pushPlain(markup.slice(last, m.index));
        // 讀音本身若是片假名（如 JR、ICOCA），也轉成平假名並用橘色標示。
        const isKata = /^[ァ-ー・]+$/.test(m[2]);
        parts.push([m[1], isKata ? toHira(m[2]) : m[2], isKata ? 'kata' : 'kanji', m[2]]);
        last = re.lastIndex;
      }
      if (last < markup.length) pushPlain(markup.slice(last));
      return parts;
    }
    function rubyNode(parts) {
      const frag = document.createDocumentFragment();
      for (const [text, reading, kind] of parts) {
        if (!reading) { frag.append(text); continue; }
        const ruby = document.createElement('ruby');
        ruby.append(text);
        const rt = document.createElement('rt');
        rt.textContent = reading;
        if (kind === 'kata') rt.className = 'k';
        ruby.append(rt);
        frag.append(ruby);
      }
      return frag;
    }
    const plainText = (parts) => parts.map(p => p[0]).join('');
    // 漢字送讀音；片假名原樣送出（轉成平假名會讓外來語念得不自然）。
    const readingText = (parts) => parts.map(p => p[3] || (p[2] === 'kata' ? p[0] : p[1]) || p[0]).join('');

    // ---------- 記住設定 ----------
    // 本機檔案（file://）在 Chrome 不會存 cookie，所以優先用 localStorage，cookie 當備援。
    const STORE_KEY = 'songSilverArrow';
    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      try {
        const m = document.cookie.match(new RegExp('(?:^|; )' + STORE_KEY + '=([^;]*)'));
        if (m) return JSON.parse(decodeURIComponent(m[1]));
      } catch {}
      return {};
    }
    const settings = loadSettings();
    function saveSettings() {
      const json = JSON.stringify(settings);
      try { localStorage.setItem(STORE_KEY, json); } catch {}
      try { document.cookie = STORE_KEY + '=' + encodeURIComponent(json) + '; max-age=31536000; path=/; SameSite=Lax'; } catch {}
    }

    // ---------- 畫面 ----------
    const items = [];
    const sectionsEl = document.getElementById('sections');
    const catsEl = document.getElementById('cats');
    const chips = new Map();   // 分類 id → 篩選按鈕
    function addChip(id, title, count) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.setAttribute('aria-pressed', 'false');
      chip.append(title);
      const small = document.createElement('small');
      small.textContent = count;
      chip.append(small);
      chip.addEventListener('click', () => applyFilter(id));
      chips.set(id, chip);
      catsEl.append(chip);
    }
    addChip('all', '全部', categories.reduce((n, c) => n + c.words.length, 0));
    for (const cat of categories) {
      const section = document.createElement('section');
      section.id = cat.id;
      section.setAttribute('aria-labelledby', 'h-' + cat.id);
      const head = document.createElement('div');
      head.className = 'sec-head';
      const h2 = document.createElement('h2');
      h2.id = 'h-' + cat.id;
      h2.textContent = cat.title;
      const desc = document.createElement('p');
      desc.textContent = cat.desc;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'play-cat';
      btn.setAttribute('aria-pressed', 'false');
      btn.textContent = '▶ 播放這一類';
      btn.setAttribute('aria-label', '播放「' + cat.title + '」全部');
      head.append(h2, desc, btn);
      const grid = document.createElement('div');
      grid.className = 'grid';
      const catItems = [];
      for (const entry of cat.words) {
        // 文法卡多一個句型欄位放最前面。
        const pattern = cat.type === 'grammar' ? entry[0] : null;
        const [markup, zh, note, useReading, size] = pattern ? entry.slice(1) : entry;
        const parts = parse(markup);
        const plain = plainText(parts);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card' + (cat.type === 'lyrics' ? ' line' : cat.type === 'grammar' ? ' wide gram' : '')
          + (size === 'wide' ? ' wide' : '') + (!cat.type && plain.length >= 9 ? ' long' : '');
        if (pattern) {
          const pat = document.createElement('span');
          pat.className = 'pat';
          pat.lang = 'ja';
          pat.append(rubyNode(parse(pattern)));
          card.append(pat);
        }
        const jp = document.createElement('span');
        jp.className = 'jp';
        jp.lang = 'ja';
        jp.append(rubyNode(parts));
        const zhEl = document.createElement('span');
        zhEl.className = 'zh';
        zhEl.textContent = zh;
        card.append(jp, zhEl);
        if (note) {
          const noteEl = document.createElement('span');
          noteEl.className = 'note';
          noteEl.append(rubyNode(parse(note)));
          card.append(noteEl);
        }
        card.setAttribute('aria-label', plain + '（' + readingText(parts) + '），' + zh + '。點一下播放發音');
        // 歌詞裡的全形空白換成「、」，念的時候才會停頓。
        const say = (typeof useReading === 'string' ? useReading : (cat.kana || useReading) ? readingText(parts) : plain).replace(/　/g, '、');
        const item = { card, cat, say, plain };
        card.addEventListener('click', () => { stopQueue(); speakOne(item); });
        items.push(item);
        catItems.push(item);
        grid.append(card);
      }
      btn.addEventListener('click', () => {
        if (queue && queue.button === btn) { stopQueue(); return; }
        playQueue(catItems, btn, '播放這一類');
      });
      section.append(head, grid);
      sectionsEl.append(section);
      cat.section = section;
      addChip(cat.id, cat.title, cat.words.length);
    }

    // ---------- 分類篩選 ----------
    let filter = 'all';
    const visibleItems = () => filter === 'all' ? items : items.filter(it => it.cat.id === filter);
    function applyFilter(id, { save = true } = {}) {
      if (!chips.has(id)) id = 'all';
      // 再點一次已選的分類＝回到全部。
      if (save && id === filter && id !== 'all') id = 'all';
      if (queue) stopQueue();
      filter = id;
      for (const [key, chip] of chips) chip.setAttribute('aria-pressed', String(key === id));
      for (const cat of categories) cat.section.hidden = id !== 'all' && cat.id !== id;
      showProgress();
      if (save) { settings.cat = id; saveSettings(); }
    }

    // ---------- 顯示切換 ----------
    function bindToggle(id, cls, key) {
      const el = document.getElementById(id);
      const set = (on) => {
        el.setAttribute('aria-pressed', String(on));
        document.body.classList.toggle(cls, !on);
      };
      if (settings[key] === false) set(false);
      el.addEventListener('click', () => {
        const on = el.getAttribute('aria-pressed') !== 'true';
        set(on);
        settings[key] = on;
        saveSettings();
      });
    }
    bindToggle('t-rt', 'no-rt', 'showReading');
    bindToggle('t-zh', 'no-zh', 'showZh');

    // 速度、間隔、重複：還原上次的選擇，改了就存起來。
    for (const id of ['rate', 'gap', 'rep']) {
      const el = document.getElementById(id);
      if (settings[id] && [...el.options].some(o => o.value === settings[id])) el.value = settings[id];
      el.addEventListener('change', () => { settings[id] = el.value; saveSettings(); });
    }

    // ---------- 語音 ----------
    const statusEl = document.getElementById('status');
    const nowEl = document.getElementById('now');
    const barEl = document.getElementById('bar');
    const miniEl = document.getElementById('mini');
    const pauseBtn = document.getElementById('mini-pause');
    const voiceSelect = document.getElementById('voice');
    const playAllBtn = document.getElementById('play-all');
    const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
    const supportsSpeech = !!(synth && 'SpeechSynthesisUtterance' in window);
    let voices = [];
    let current = null;      // 目前的 utterance，保留參照避免被回收而不觸發 onend
    let watchdog = null;
    let queue = null;        // { list, index, rep, paused, button, label, timer }
    const repSelect = document.getElementById('rep');
    const repeatCount = () => Number(repSelect.value);   // 連續播放時每張卡念幾次

    function loadVoices() {
      if (!supportsSpeech) {
        voiceSelect.replaceChildren(new Option('此瀏覽器不支援發音', ''));
        statusEl.textContent = '此瀏覽器不支援語音播放，仍可看單字與讀音。';
        return;
      }
      // 上次選的聲音優先（選單變更時會同步存進 settings.voice）。
      const selected = settings.voice || voiceSelect.value;
      voices = synth.getVoices().filter(v => /^ja(?:[-_]|$)/i.test(v.lang));
      voiceSelect.replaceChildren();
      if (!voices.length) {
        voiceSelect.append(new Option('未找到日語語音', ''));
        statusEl.textContent = '這台裝置尚未提供日語語音。可在系統語音設定加入日語後重新開啟頁面。';
      } else {
        for (const v of voices) voiceSelect.append(new Option(v.localService ? v.name : v.name + '（需網路）', v.voiceURI));
        // 離線時線上語音念不出來，只從裝置內建的語音中挑；settings.voice 保留不動，恢復連線後會選回來。
        const local = navigator.onLine ? [] : voices.filter(v => v.localService);
        const pool = local.length ? local : voices;
        // 優先選品質最好的聲音：Edge 線上神經語音 → Google 日本語 → 其他。
        const preferred = pool.find(v => v.voiceURI === selected)
          || pool.find(v => /Natural|Online/i.test(v.name))
          || pool.find(v => /Google/i.test(v.name))
          || pool[0];
        voiceSelect.value = preferred.voiceURI;
        statusEl.textContent = '';
      }
      voiceSelect.disabled = !voices.length;
    }

    function clearSpeaking() {
      for (const it of items) it.card.classList.remove('speaking');
    }
    function cancelSpeech() {
      current = null;
      clearTimeout(watchdog);
      if (supportsSpeech) synth.cancel();
      clearSpeaking();
    }
    // 念一個詞；念完（或失敗、逾時）後呼叫 done。
    function speakOne(item, done) {
      const voice = voices.find(v => v.voiceURI === voiceSelect.value);
      if (!supportsSpeech || !voice) {
        statusEl.textContent = '目前沒有可用的日語語音，請檢查裝置的語音設定。';
        if (done) stopQueue();
        return;
      }
      cancelSpeech();
      const u = new SpeechSynthesisUtterance(item.say);
      current = u;
      u.lang = 'ja-JP';
      u.voice = voice;
      u.rate = Number(document.getElementById('rate').value);
      item.card.classList.add('speaking');
      let finished = false;
      const finish = (ok) => {
        if (finished || current !== u) return;
        finished = true;
        clearTimeout(watchdog);
        item.card.classList.remove('speaking');
        current = null;
        if (!ok) statusEl.textContent = '有一個詞未能播放，請確認音量與日語語音。';
        if (done) done();
      };
      u.onend = () => finish(true);
      u.onerror = (e) => { if (e.error !== 'interrupted' && e.error !== 'canceled') finish(false); };
      // 部分瀏覽器偶爾不觸發 onend，最多等 12 秒就繼續下一個。
      watchdog = setTimeout(() => finish(true), 12000);
      statusEl.textContent = '';
      // cancel() 之後立刻 speak() 在 Chrome 偶爾會被吞掉，稍等一下再念。
      setTimeout(() => { if (current === u) synth.speak(u); }, 60);
    }

    function setPressed(btn, on, label) {
      btn.setAttribute('aria-pressed', String(on));
      if (btn === playAllBtn) {
        btn.querySelector('.icon').textContent = on ? '■' : '▶';
        btn.querySelector('.label').textContent = on ? '停止' : label;
      } else {
        btn.textContent = on ? '■ 停止' : '▶ ' + label;
      }
    }
    function showProgress() {
      miniEl.hidden = !queue;
      document.body.classList.toggle('playing', !!queue);
      if (!queue) {
        nowEl.textContent = '';
        barEl.style.width = '0';
        return;
      }
      const it = queue.list[queue.index];
      const doneCount = queue.index + 1;
      const total = queue.list.length;
      // 詞放最前面：手機上這行放不下時，被截掉的是後面的分類與進度。
      nowEl.textContent = '';
      const b = document.createElement('strong');
      b.lang = 'ja';
      b.textContent = it.plain;
      nowEl.append(b, '　' + (queue.rep + 1) + '/' + repeatCount() + '　· ' + it.cat.title + ' ' + doneCount + ' / ' + total);
      pauseBtn.textContent = queue.paused ? '▶ 繼續' : '❚❚ 暫停';
      pauseBtn.setAttribute('aria-pressed', String(queue.paused));
      barEl.style.width = (doneCount / total * 100) + '%';
    }
    function playQueue(list, button, label) {
      stopQueue();
      queue = { list, index: 0, rep: 0, paused: false, button, label, timer: null };
      setPressed(button, true, label);
      step();
    }
    function step() {
      if (!queue || queue.paused) return;
      if (queue.index >= queue.list.length) { stopQueue(); return; }
      const it = queue.list[queue.index];
      showProgress();
      if (queue.rep === 0) revealAhead(queue.list, queue.index);
      speakOne(it, () => {
        if (!queue) return;
        // 同一張念滿「重複」設定的次數才換下一個；每次之間都停「間隔」設定的時間，方便跟著念。
        if (++queue.rep >= repeatCount()) { queue.rep = 0; queue.index++; }
        queue.timer = setTimeout(step, Number(document.getElementById('gap').value));
      });
    }
    // 捲到「正在念的卡片 + 下一排」都看得到：目前的卡在倒數第二排，可以先看到後面的詞。
    function revealAhead(list, index) {
      const cur = list[index].card.getBoundingClientRect();
      // 下一排＝之後第一張頂端在目前這張底下的卡（桌機一排有好幾張）。
      const nextRow = list.slice(index + 1).find(it => it.card.getBoundingClientRect().top >= cur.bottom - 1);
      const target = nextRow ? nextRow.card.getBoundingClientRect() : cur;
      const top = 8;
      const bottom = innerHeight - (miniEl.hidden ? 0 : miniEl.offsetHeight) - 8;
      if (cur.top >= top && target.bottom <= bottom) return;
      // 讓下一排貼齊底部；但正在念的卡永遠要看得到頂端。
      const delta = Math.min(target.bottom - bottom, cur.top - top);
      window.scrollBy({ top: delta, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    // 暫停：停在目前這個詞（和第幾次），繼續時從這裡重念。
    function pauseQueue() {
      if (!queue || queue.paused) return;
      queue.paused = true;
      clearTimeout(queue.timer);
      cancelSpeech();
      // 暫停時仍標出停在哪一張。
      queue.list[queue.index].card.classList.add('speaking');
      showProgress();
    }
    function resumeQueue() {
      if (!queue || !queue.paused) return;
      queue.paused = false;
      step();
    }
    function stopQueue() {
      if (queue) {
        clearTimeout(queue.timer);
        setPressed(queue.button, false, queue.label);
        queue = null;
      }
      cancelSpeech();
      showProgress();
    }
    // 「全部播放」只念目前篩選後看得到的詞。
    playAllBtn.addEventListener('click', () => {
      if (queue && queue.button === playAllBtn) { stopQueue(); return; }
      playQueue(visibleItems(), playAllBtn, '全部播放');
    });
    pauseBtn.addEventListener('click', () => { if (queue && queue.paused) resumeQueue(); else pauseQueue(); });
    document.getElementById('mini-stop').addEventListener('click', stopQueue);
    voiceSelect.addEventListener('change', () => { settings.voice = voiceSelect.value; saveSettings(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stopQueue(); });
    // 鎖螢幕或切到別的 App 時只暫停，回來可以按「繼續」接著念。
    document.addEventListener('visibilitychange', () => { if (document.hidden) pauseQueue(); });
    window.addEventListener('pagehide', stopQueue);

    loadVoices();
    if (supportsSpeech) {
      synth.addEventListener('voiceschanged', loadVoices);
      setTimeout(loadVoices, 1500);
      window.addEventListener('online', loadVoices);
      window.addEventListener('offline', loadVoices);
    }
    applyFilter(settings.cat || 'all', { save: false });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  </script>
</body>
</html>
