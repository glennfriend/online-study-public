<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#23695c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <title>假名三連詞</title>
  <style>
    :root { --ink: #253e3b; --muted: #64756f; --green: #23695c; --paper: #fffdf8; --line: #e2e7dc; --hi: #d48b38; }
    * { box-sizing: border-box; }
    /* 連點時不會雙擊放大；橫向時 iOS 不會自動放大字。 */
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; background: #f5f3eb; color: var(--ink); font-family: system-ui, -apple-system, "Noto Sans JP", "Noto Sans TC", sans-serif; line-height: 1.7; }
    button, select { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--hi); outline-offset: 4px; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    .back { display: inline-block; padding: 4px 0; color: var(--muted); text-decoration: none; font-size: .95rem; }
    h1 { margin: 4px 0 4px; font-size: 1.6rem; }
    .controls { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 14px; margin-bottom: 16px; }
    /* iOS Safari 在字級小於 16px 的選單取得焦點時會自動放大畫面。 */
    select { font-size: 16px; width: 100%; min-width: 0; border: 1px solid #ced8cc; background: var(--paper); color: var(--ink); border-radius: 8px; padding: 6px 10px; }
    .card { position: relative; display: block; width: 100%; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: 0 8px 28px #344e3b0d; padding: 18px 16px 14px; text-align: center; color: var(--ink); }
    .card:hover { border-color: #b9cdb8; }
    .card.playing { border-color: var(--green); }
    .counter { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--muted); }
    .big { display: block; font-size: 120px; line-height: 1.15; font-weight: 700; color: var(--green); transition: transform .25s, color .25s; }
    .big.hira { color: #8a4b00; }
    .big.pulse { transform: scale(1.08); }
    .tap { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
    .words { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
    .word { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); text-align: left; transition: background .2s, border-color .2s; }
    .word .ja { font-size: 26px; font-weight: 600; letter-spacing: .04em; line-height: 1.4; overflow-wrap: anywhere; }
    .word .ja.long { font-size: 20px; letter-spacing: 0; }
    .word .ja strong { color: var(--hi); font-weight: 800; }
    .word .zh { font-size: 16px; font-weight: 600; color: #365b45; white-space: nowrap; }
    .word .zh:empty::before { content: "？"; color: #c0c9bc; font-weight: 400; }
    .word .reps { grid-column: 1 / -1; display: flex; gap: 6px; }
    .word .reps i { width: 8px; height: 8px; border-radius: 50%; background: #e2e7dc; transition: background .2s; }
    .word .reps i.on { background: var(--green); }
    .word.speaking { background: #eaf3e6; border-color: var(--green); }
    .placeholder { padding: 18px; text-align: center; color: #a9b4a6; border: 1px dashed #d5dccf; border-radius: 14px; font-size: 14px; }
    .hint { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: #e9efe5; font-size: 14px; }
    .hint strong { display: block; color: var(--green); margin-bottom: 2px; }
    .status { margin: 12px 4px 0; font-size: 13px; color: #9a4b1c; }
    .status:empty { display: none; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← 日本語の基礎</a>
    <h1>假名三連詞</h1>
    <div class="controls">
      <label for="rate">播放速度</label>
      <select id="rate"><option value="1" selected>一般速度</option><option value="0.75">慢慢念</option></select>
      <label for="count">練習數量</label>
      <select id="count"><option value="1">1 個字</option><option value="10">10 個字</option><option value="46" selected>46 個字（全部）</option></select>
      <label for="voice">日語聲音</label>
      <select id="voice" disabled><option>正在尋找日語語音…</option></select>
    </div>
    <noscript><p>請啟用 JavaScript 才能練習。</p></noscript>

    <button type="button" class="card" id="card">
      <span class="counter" id="counter"></span>
      <span class="big" id="big" lang="ja"></span>
      <span class="tap" id="tap">點一下開始</span>
    </button>

    <ul class="words" id="words"></ul>
    <div class="hint" id="hint" hidden><strong>記憶小撇步</strong><span id="hint-text"></span></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

  </main>
  <script>
    'use strict';
    // [平假名, 記憶提示, [[詞, 中文, 朗讀用文字], ×3]]：朗讀用漢字，避免同音字被讀成別的意思。
    const DATA = [
      ['あ', '「あ」都在開頭，都是吃東西時的感覺。', [['あまい', '甜的', '甘い'], ['あつい', '好燙', '熱い'], ['あじ', '味道', '味']]],
      ['い', '「い」都在開頭，都是吃的。', [['いちご', '草莓', '苺'], ['いか', '花枝', 'イカ'], ['いなりずし', '豆皮壽司', '稲荷寿司']]],
      ['う', '「う」都在開頭，都是日本料理。', [['うどん', '烏龍麵', 'うどん'], ['うなぎ', '鰻魚', '鰻'], ['うに', '海膽', '雲丹']]],
      ['え', '「え」都在開頭，都是吃的；えきべん 就是「駅（車站）＋弁当」。', [['えび', '蝦子', '海老'], ['えだまめ', '毛豆', '枝豆'], ['えきべん', '鐵路便當', '駅弁']]],
      ['お', '「お」都在開頭，都是一坐下店員就會送上來的。', [['おちゃ', '茶', 'お茶'], ['おみず', '水', 'お水'], ['おしぼり', '濕毛巾', 'おしぼり']]],
      ['か', '「か」都在開頭，都是旅行最容易忘記帶的東西。', [['かさ', '雨傘', '傘'], ['かばん', '包包', '鞄'], ['かぎ', '鑰匙', '鍵']]],
      ['き', '「き」都在最後，都跟搭車、搭飛機有關；えき 和 せき 只差第一個字。', [['えき', '車站', '駅'], ['せき', '座位', '席'], ['ひこうき', '飛機', '飛行機']]],
      ['く', '「く」都在開頭，都跟交通有關；くうこう、くうせき 的「くう」都是「空」。', [['くうこう', '機場', '空港'], ['くうせき', '空位', '空席'], ['くるま', '車子', '車']]],
      ['け', '「け」都在開頭，都是逛藥妝店會用到；前兩個都是「けしょう＝化妝」。', [['けしょうひん', '化妝品', '化粧品'], ['けしょうすい', '化妝水', '化粧水'], ['けっこうです', '不用了，謝謝', '結構です']]],
      ['こ', '「こ」都在開頭，都是一開口就用得到的一句話。', [['こんにちは', '你好', 'こんにちは'], ['こんばんは', '晚安（晚上好）', 'こんばんは'], ['これください', '請給我這個', 'これください']]],
      ['さ', '「さ」都在開頭，都是魚。', [['さしみ', '生魚片', '刺身'], ['さけ', '鮭魚', '鮭'], ['さば', '鯖魚', '鯖']]],
      ['し', '「し」都在開頭，都是餐桌上的調味料。', [['しお', '鹽', '塩'], ['しょうゆ', '醬油', '醤油'], ['しちみ', '七味粉', '七味']]],
      ['す', '「す」都在開頭，都跟上餐廳有關。', [['すし', '壽司', '寿司'], ['すきやき', '壽喜燒', 'すき焼き'], ['すみません', '不好意思（叫店員）', 'すみません']]],
      ['せ', '都以「せき（座位）」結尾，都是新幹線的座位。', [['せき', '座位', '席'], ['していせき', '對號座', '指定席'], ['じゆうせき', '自由座', '自由席']]],
      ['そ', '都以「みそ」開頭，「そ」都在第二個字。', [['みそ', '味噌', '味噌'], ['みそしる', '味噌湯', '味噌汁'], ['みそかつ', '味噌豬排', '味噌カツ']]],
      ['た', '「た」都在開頭，都以「やき（燒）」結尾。', [['たこやき', '章魚燒', 'たこ焼き'], ['たいやき', '鯛魚燒', 'たい焼き'], ['たまごやき', '玉子燒', '卵焼き']]],
      ['ち', '「ち」都在開頭，都是問路用得到；ちかてつ、ちかい 都是「ちか」。', [['ちず', '地圖', '地図'], ['ちかてつ', '地下鐵', '地下鉄'], ['ちかい', '很近', '近い']]],
      ['つ', '「つ」都在開頭，都是吃的；つけめん、つけもの 都是「つけ（沾、醃）」。', [['つけめん', '沾麵', 'つけ麺'], ['つけもの', '醬菜', '漬物'], ['つくね', '雞肉丸串', 'つくね']]],
      ['て', '「て」都在開頭，都是日本料理；てんぷら、てんどん 都是「てん（天）」。', [['てんぷら', '天婦羅', '天ぷら'], ['てんどん', '天丼', '天丼'], ['てっぱんやき', '鐵板燒', '鉄板焼き']]],
      ['と', '「と」都在開頭，都是肉；とんかつ、とんこつ 的「とん」是豬。', [['とんかつ', '炸豬排', '豚カツ'], ['とんこつ', '豚骨（豬骨湯頭）', '豚骨'], ['とりにく', '雞肉', '鶏肉']]],
      ['な', '「な」都在開頭，都是日本餐桌上的。', [['なっとう', '納豆', '納豆'], ['なべ', '火鍋', '鍋'], ['なまたまご', '生雞蛋', '生卵']]],
      ['に', '都以「にく（肉）」結尾，都是肉。', [['ぎゅうにく', '牛肉', '牛肉'], ['ぶたにく', '豬肉', '豚肉'], ['やきにく', '燒肉', '焼肉']]],
      ['ぬ', '都以「ぬき（拿掉）」結尾，點餐說「不要加…」。', [['わさびぬき', '不加芥末', 'わさび抜き'], ['こおりぬき', '去冰', '氷抜き'], ['ねぎぬき', '不要蔥', 'ねぎ抜き']]],
      ['ね', '「ね」都在開頭，都是「値」，都跟價錢有關。', [['ねだん', '價格', '値段'], ['ねふだ', '價格標籤', '値札'], ['ねびき', '打折', '値引き']]],
      ['の', '都以「のり（搭乘）」開頭，都是搭車用的。', [['のりば', '乘車處', '乗り場'], ['のりかえ', '轉乘', '乗り換え'], ['のりほうだい', '無限搭乘（周遊券）', '乗り放題']]],
      ['は', '都以「ごはん」結尾，「は」都在最後兩個字。', [['ごはん', '白飯', 'ご飯'], ['あさごはん', '早餐', '朝ご飯'], ['ひるごはん', '午餐', '昼ご飯']]],
      ['ひ', '「ひ」都在開頭，都是看方向用的；後兩個都是「ひがし（東）」。', [['ひだり', '左邊', '左'], ['ひがし', '東邊', '東'], ['ひがしぐち', '東口', '東口']]],
      ['ふ', '「ふ」都在開頭，都是「二」。', [['ふたり', '兩個人', '二人'], ['ふたつ', '兩個', '二つ'], ['ふつか', '兩天（二號）', '二日']]],
      ['へ', '「へ」都在開頭，都是住飯店會用到。', [['へや', '房間', '部屋'], ['へやばんごう', '房間號碼', '部屋番号'], ['へんこう', '更改（預約）', '変更']]],
      ['ほ', '「ほ」都在開頭，都跟北海道有關。', [['ほたて', '扇貝', '帆立'], ['ほっけ', '花魚', 'ほっけ'], ['ほっかいどう', '北海道', '北海道']]],
      ['ま', '「ま」都在開頭，都是吃的。', [['まっちゃ', '抹茶', '抹茶'], ['まんじゅう', '饅頭', '饅頭'], ['まぐろ', '鮪魚', '鮪']]],
      ['み', '「み」都在開頭，都是看方向用的；後兩個都是「みなみ（南）」。', [['みぎ', '右邊', '右'], ['みなみ', '南邊', '南'], ['みなみぐち', '南口', '南口']]],
      ['む', '「む」都在開頭，都是「無」。', [['むりょう', '免費', '無料'], ['むり', '沒辦法', '無理'], ['むせん', '無線網路', '無線']]],
      ['め', '「め」都在開頭，都是「免」。', [['めんぜい', '免稅', '免税'], ['めんぜいてん', '免稅店', '免税店'], ['めんきょしょう', '駕照', '免許証']]],
      ['も', '「も」都在開頭，都是甜點水果。', [['もち', '麻糬', '餅'], ['もも', '桃子', '桃'], ['もなか', '最中（和菓子）', '最中']]],
      ['や', '都以「やき（燒）」開頭，都是吃的。', [['やきとり', '烤雞肉串', '焼き鳥'], ['やきそば', '炒麵', '焼きそば'], ['やきおにぎり', '烤飯糰', '焼きおにぎり']]],
      ['ゆ', '「ゆ」都在開頭，都跟泡溫泉有關；ゆ 就是「湯」。', [['ゆ', '熱水、溫泉', '湯'], ['ゆかた', '浴衣', '浴衣'], ['ゆどうふ', '湯豆腐', '湯豆腐']]],
      ['よ', '「よ」都在開頭，都是「予（預）」。', [['よやく', '預約', '予約'], ['よてい', '行程', '予定'], ['よさん', '預算', '予算']]],
      ['ら', '都以「くら」結尾，「ら」都在最後。', [['さくら', '櫻花', '桜'], ['まくら', '枕頭', '枕'], ['いくら', '鮭魚卵（也是「多少錢」）', 'いくら']]],
      ['り', '都以「りょ」開頭，都跟旅行、住宿有關。', [['りょかん', '日式旅館', '旅館'], ['りょこう', '旅行', '旅行'], ['りょうきん', '費用', '料金']]],
      ['る', '「る」都在最後，都是旅行移動的動詞。', [['のる', '搭（車）', '乗る'], ['おりる', '下（車）', '降りる'], ['とまる', '住宿', '泊まる']]],
      ['れ', '「れ」都在最後，都是指東西用的。', [['これ', '這個', 'これ'], ['それ', '那個', 'それ'], ['あれ', '遠處那個', 'あれ']]],
      ['ろ', '都以「ろ」結尾，都是泡湯；ふろ 變成 ぶろ。', [['おふろ', '浴池、洗澡', 'お風呂'], ['ろてんぶろ', '露天溫泉', '露天風呂'], ['かぞくぶろ', '包場家庭湯', '家族風呂']]],
      ['わ', '「わ」都在開頭，都是「和（日本的）」。', [['わがし', '和菓子', '和菓子'], ['わしょく', '日本料理', '和食'], ['わぎゅう', '和牛', '和牛']]],
      ['を', '「を」都在「ください」前面，念成「お」，都是請店員給東西。', [['おみずをください', '請給我水', 'お水をください'], ['これをください', '請給我這個', 'これをください'], ['メニューをください', '請給我菜單', 'メニューをください']]],
      ['ん', '都以「せん」結尾，「ん」都在最後。', [['おんせん', '溫泉', '温泉'], ['しんかんせん', '新幹線', '新幹線'], ['すみません', '不好意思', 'すみません']]]
    ];

    const toKata = s => s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const $ = id => document.getElementById(id);
    const card = $('card'), big = $('big'), tap = $('tap'), wordsEl = $('words');
    const hint = $('hint'), hintText = $('hint-text'), status = $('status'), voiceSelect = $('voice');

    // 一回合：從 46 個裡隨機抽 N 個，依序自動念完；字與字之間停兩秒。
    let session = [];
    let pos = 0;
    let current = null;
    let rows = [];
    let runId = 0;
    let playing = false;

    function newSession() {
      session = shuffle(DATA).slice(0, Number($('count').value));
      pos = 0;
      show();
    }

    function show() {
      current = session[pos];
      const [kana] = current;
      big.textContent = toKata(kana);
      big.classList.remove('hira');
      $('counter').textContent = `${pos + 1} / ${session.length}`;
      card.setAttribute('aria-label', `片假名 ${toKata(kana)}`);
      hint.hidden = true;
      rows = [];
      const ph = document.createElement('li');
      ph.className = 'placeholder';
      ph.textContent = '點上面的片假名開始，三個詞就會出現';
      wordsEl.replaceChildren(ph);
    }

    function renderWords(kana, words) {
      const items = words.map(([word, zh, spoken]) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'word';
        const ja = document.createElement('span');
        ja.className = word.length >= 7 ? 'ja long' : 'ja';
        ja.lang = 'ja';
        const at = word.indexOf(kana);
        [...word].forEach((ch, i) => {
          const el = document.createElement(i === at ? 'strong' : 'span');
          el.textContent = ch;
          ja.append(el);
        });
        const zhEl = document.createElement('span');
        zhEl.className = 'zh';
        zhEl.setAttribute('aria-live', 'polite');
        const reps = document.createElement('span');
        reps.className = 'reps';
        reps.setAttribute('aria-hidden', 'true');
        for (let i = 0; i < 3; i++) reps.append(document.createElement('i'));
        btn.append(ja, zhEl, reps);
        li.append(btn);
        const row = { btn, zhEl, reps, zh, spoken };
        // 暫停時單獨點某個詞：念一次並顯示中文。
        btn.addEventListener('click', async () => {
          if (playing) return;
          synth && synth.cancel();
          row.zhEl.textContent = row.zh;
          btn.classList.add('speaking');
          await say(row.spoken);
          btn.classList.remove('speaking');
        });
        return { li, row };
      });
      wordsEl.replaceChildren(...items.map(item => item.li));
      rows = items.map(item => item.row);
    }

    // 念完一個字（假名三次＋三個詞各三次），被中斷時回傳 false。
    async function playOne(alive, thinkMs = 0) {
      const [kana, tip, words] = current;
      const kata = toKata(kana);
      // 三個詞的位置隨機，但一律由上往下念。
      renderWords(kana, shuffle(words));
      hint.hidden = true;
      big.textContent = kata;
      big.classList.remove('hira');
      // 自動換字後先停一下，讓人看著片假名和三個詞想想怎麼念。
      if (thinkMs) {
        await wait(thinkMs);
        if (!alive()) return false;
      }

      // 單一假名用片假名送去念，避免「は」「へ」被當助詞讀成 wa、e。
      for (let i = 0; i < 3; i++) {
        if (i === 1) {
          big.textContent = kana;
          big.classList.add('hira');
        }
        big.classList.add('pulse');
        await say(kata);
        big.classList.remove('pulse');
        if (!alive()) return false;
        await wait(350);
        if (!alive()) return false;
      }

      for (const row of rows) {
        await wait(400);
        if (!alive()) return false;
        row.btn.classList.add('speaking');
        row.btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        for (let i = 0; i < 3; i++) {
          if (i === 0) row.zhEl.textContent = row.zh;
          row.reps.children[i].classList.add('on');
          await say(row.spoken);
          if (!alive()) return false;
          await wait(300);
          if (!alive()) return false;
        }
        row.btn.classList.remove('speaking');
      }
      hintText.textContent = tip;
      hint.hidden = false;
      return true;
    }

    async function run() {
      const id = ++runId;
      const alive = () => id === runId;
      playing = true;
      card.classList.add('playing');
      tap.hidden = true;
      let thinkMs = 0;
      while (alive()) {
        if (!(await playOne(alive, thinkMs))) return;
        thinkMs = 2000;
        if (pos + 1 >= session.length) break;
        await wait(2000);
        if (!alive()) return;
        pos++;
        show();
      }
      playing = false;
      card.classList.remove('playing');
      tap.textContent = '全部念完了，點一下重新開始';
      tap.hidden = false;
      pos = session.length;
    }

    function stop(label = '點一下繼續') {
      runId++;
      playing = false;
      currentUtterance = null;
      if (supportsSpeech) synth.cancel();
      card.classList.remove('playing');
      big.classList.remove('pulse');
      for (const row of rows) row.btn.classList.remove('speaking');
      tap.textContent = label;
      tap.hidden = false;
    }

    // 點片假名：開始／暫停；暫停後再點，從目前這個字重新念。
    function onCard() {
      if (playing) return stop();
      if (pos >= session.length) newSession();
      else show();
      run();
    }
    const wait = ms => new Promise(r => setTimeout(r, ms));

    // ---- 語音 ----
    const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
    const supportsSpeech = !!synth && 'SpeechSynthesisUtterance' in window;
    let voices = [];
    let currentUtterance = null;

    function loadVoices() {
      if (!supportsSpeech) {
        voiceSelect.replaceChildren(new Option('此瀏覽器不支援發音', ''));
        status.textContent = '此瀏覽器不支援語音播放，仍可看字練習。';
        return;
      }
      const selected = voiceSelect.value;
      voices = synth.getVoices().filter(v => /^ja(?:[-_]|$)/i.test(v.lang));
      voiceSelect.replaceChildren();
      if (!voices.length) {
        voiceSelect.append(new Option('未找到日語語音', ''));
        status.textContent = '這台裝置尚未提供日語語音。可在系統語音設定加入日語後重新開啟頁面。';
      } else {
        for (const v of voices) voiceSelect.append(new Option(v.localService ? v.name : v.name + '（需網路）', v.voiceURI));
        // 離線時線上語音念不出來，只從裝置內建的語音中挑。
        const local = navigator.onLine ? [] : voices.filter(v => v.localService);
        const pool = local.length ? local : voices;
        const preferred = pool.find(v => v.voiceURI === selected)
          || pool.find(v => /Natural|Online/i.test(v.name))
          || pool.find(v => /Google/i.test(v.name))
          || pool[0];
        voiceSelect.value = preferred.voiceURI;
        status.textContent = '';
      }
      voiceSelect.disabled = !voices.length;
    }

    // 念完（或失敗、逾時）才 resolve，讓整段流程可以一句接一句。
    function say(text) {
      return new Promise(resolve => {
        const voice = voices.find(v => v.voiceURI === voiceSelect.value);
        if (!supportsSpeech || !voice) {
          status.textContent = '目前沒有可用的日語語音，請檢查裝置的語音設定。';
          setTimeout(resolve, 800);
          return;
        }
        const u = new SpeechSynthesisUtterance(text);
        currentUtterance = u;
        u.lang = 'ja-JP';
        u.voice = voice;
        u.rate = Number($('rate').value);
        let done = false;
        const finish = () => { if (done) return; done = true; clearTimeout(guard); resolve(); };
        // 有些瀏覽器偶爾不觸發 onend，逾時就當作念完。
        const guard = setTimeout(() => { if (!done && currentUtterance === u) status.textContent = '語音沒有回應，請確認日語語音與音量。'; finish(); }, 8000);
        u.onstart = () => { status.textContent = ''; };
        u.onend = finish;
        u.onerror = finish;
        try { synth.speak(u); } catch { finish(); }
      });
    }

    loadVoices();
    if (supportsSpeech) {
      synth.addEventListener('voiceschanged', loadVoices);
      setTimeout(loadVoices, 1500);
      window.addEventListener('online', loadVoices);
      window.addEventListener('offline', loadVoices);
    }

    card.addEventListener('click', onCard);
    $('count').addEventListener('change', () => { stop('點一下開始'); newSession(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && playing) stop(); });
    window.addEventListener('pagehide', () => stop());

    newSession();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  </script>
</body>
</html>
